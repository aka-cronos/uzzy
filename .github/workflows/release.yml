name: Release

# Pushing a v* tag builds Uzzy.dmg from the tagged commit, signs it with
# Developer ID, notarizes and staples both the app and the .dmg, and attaches
# it to a draft GitHub Release. The maintainer tries the draft and publishes
# it by hand. See "Releases" in CONTRIBUTING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and draft release
    runs-on: xcode-27
    timeout-minutes: 60
    # Holds the signing and notarization secrets. Limit it to v* tags in the
    # repository's environment settings.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show environment
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version

      - name: Set paths
        run: |
          echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$RUNNER_TEMP/developer-id.p12" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/release.keychain-db" >> "$GITHUB_ENV"
          echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Runs before any secret is touched, so a mistagged commit fails
      # without signing anything.
      - name: Check the tag matches MARKETING_VERSION
        run: |
          tag_version="${TAG#v}"
          tag_version="${tag_version%%-*}"
          marketing_version="$(xcodebuild -showBuildSettings \
            -project app/Uzzy.xcodeproj \
            -scheme Uzzy \
            -configuration Release \
            | awk -F ' = ' '/^ *MARKETING_VERSION = / { print $2; exit }')"
          echo "Tag version: $tag_version"
          echo "MARKETING_VERSION: $marketing_version"
          if [ -z "$marketing_version" ] || [ "$tag_version" != "$marketing_version" ]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION ($marketing_version). Bump the version in a pull request before tagging."
            exit 1
          fi

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          keychain_password="$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERTIFICATE_PATH"

          # "Developer ID Application: Name (TEAMID)"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate."
            exit 1
          fi
          team_id="$(printf '%s' "$identity" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')"
          if [ -z "$team_id" ]; then
            echo "::error::No team ID in the identity name: $identity"
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "TEAM_ID=$team_id" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$API_KEY_PATH"

      # Overrides app/Config/Signing.xcconfig's ad hoc default for this build
      # only. Hardened Runtime comes from the Release configuration.
      - name: Archive
        run: |
          xcodebuild archive \
            -project app/Uzzy.xcodeproj \
            -scheme Uzzy \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Uzzy.xcarchive" \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH --timestamp"

      - name: Export with Developer ID signing
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :method string developer-id" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string Developer ID Application" \
            -c "Add :teamID string $TEAM_ID" \
            "$export_options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Uzzy.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$DIST"
          codesign --display --verbose=2 "$DIST/Uzzy.app"

      - name: Notarize and staple the app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$DIST/Uzzy.app" "$RUNNER_TEMP/Uzzy.zip"
          .github/scripts/notarize.sh "$RUNNER_TEMP/Uzzy.zip"
          xcrun stapler staple "$DIST/Uzzy.app"

      - name: Build and sign Uzzy.dmg
        run: |
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto "$DIST/Uzzy.app" "$staging/Uzzy.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname Uzzy \
            -srcfolder "$staging" \
            -format UDZO \
            -ov \
            "$DIST/Uzzy.dmg"
          codesign --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --timestamp \
            "$DIST/Uzzy.dmg"

      - name: Notarize and staple Uzzy.dmg
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          .github/scripts/notarize.sh "$DIST/Uzzy.dmg"
          xcrun stapler staple "$DIST/Uzzy.dmg"

      - name: Verify
        run: |
          set -x
          codesign --verify --strict --deep --verbose=2 "$DIST/Uzzy.app"
          codesign --verify --strict --deep --verbose=2 "$DIST/Uzzy.dmg"
          spctl --assess --type exec --verbose=4 "$DIST/Uzzy.app"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DIST/Uzzy.dmg"
          xcrun stapler validate "$DIST/Uzzy.app"
          xcrun stapler validate "$DIST/Uzzy.dmg"
          syspolicy_check distribution "$DIST/Uzzy.app"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" "$DIST/Uzzy.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Uzzy ${TAG#v}" \
            $prerelease

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2> /dev/null || true
          rm -f "$CERTIFICATE_PATH" "$API_KEY_PATH"
