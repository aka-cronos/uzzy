name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    # The branch ruleset requires this check by name; keep it stable.
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show environment
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version

      # Ad hoc signing with no team, so the build needs no Apple account,
      # signing secret or app/Config/Local.xcconfig.
      - name: Build and run tests
        run: |
          xcodebuild test \
            -project app/Uzzy.xcodeproj \
            -scheme Uzzy \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
